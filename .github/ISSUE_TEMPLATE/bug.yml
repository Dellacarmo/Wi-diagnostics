name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. npm run web:demo
        2. …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [Terminal (npm run cli), Navegador 3D (npm run web), App desktop]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs ou prints
      description: Sem SSIDs, BSSIDs ou IPs reais. Se der, reproduza no modo demo.
      render: text
